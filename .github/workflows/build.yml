name: Build and upload

on:
  workflow_dispatch:

env:
  # ffpatched is built from master; prebuilt FFmpeg libs must match master's ABI
  FFMPEG_VERSION: 9.0-master

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm wget unzip zip

      - name: Build for Windows x64
        run: cd fftools && make libavutil/ffversion.h win_64_get_dependencies win_64_config win_64_build

      - name: Zip
        run: cd fftools && zip -r ffpatched_win64.zip ffpatched_win64

      - uses: actions/upload-artifact@v4
        with:
          name: ffpatched_win64
          path: fftools/ffpatched_win64.zip

  test-windows-x64:
    needs: build-windows-x64
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffpatched_win64

      - name: Smoke test
        shell: bash
        run: |
          unzip -q ffpatched_win64.zip
          ./ffpatched_win64/ffpatched.exe -version

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2 pkgconf
          brew install --HEAD ffmpeg

      - name: Build for Apple Silicon
        run: cd fftools && make libavutil/ffversion.h config build

      - name: Smoke test
        run: ./fftools/ffpatched_arm64/ffpatched -version

      - name: Zip
        run: cd fftools && zip -r ffpatched_arm64.zip ffpatched_arm64

      - uses: actions/upload-artifact@v4
        with:
          name: ffpatched_arm64
          path: fftools/ffpatched_arm64.zip

  release:
    needs: [test-windows-x64, build-macos-arm64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FFMPEG_VERSION }}.${{ github.run_number }}
          name: Release ${{ env.FFMPEG_VERSION }}.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            ffpatched_win64.zip
            ffpatched_arm64.zip
